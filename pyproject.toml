[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "defectdojo-mcp"
version = "0.1.0"
description = "Official open-source MCP server for DefectDojo. Connect Claude, Cursor, VS Code and other MCP clients to DefectDojo."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "DefectDojo Inc" }]
requires-python = ">=3.11"
keywords = ["defectdojo", "mcp", "model-context-protocol", "security", "vulnerability-management", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "anyio>=4.9",
    # httpx trusts certifi's bundle. 2026.10.19 is the first release without the eMudhra roots
    # (Mozilla bug 2083449); a direct floor keeps pip/uvx installs, which ignore uv.lock, on it.
    "certifi>=2026.10.19",
    "pydantic>=2.12",
    "starlette>=1.9.0",
    "uvicorn>=0.31",
]

[project.urls]
Homepage = "https://github.com/DefectDojo/defectdojo-mcp"
Repository = "https://github.com/DefectDojo/defectdojo-mcp"
Issues = "https://github.com/DefectDojo/defectdojo-mcp/issues"
Changelog = "https://github.com/DefectDojo/defectdojo-mcp/blob/main/CHANGELOG.md"
DefectDojo = "https://github.com/DefectDojo/django-DefectDojo"

[project.scripts]
defectdojo-mcp = "defectdojo_mcp.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/defectdojo_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/defectdojo_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md", "server.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL", "ASYNC", "PT", "C90"]
ignore = [
    "PLR0913", # tools mirror the API, so many keyword arguments are expected
    "PLR0917",
    "PLR0912",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "PLR2004", "PLC0415"]
"src/defectdojo_mcp/cli.py" = ["PLC0415"] # lazy imports keep --help fast

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: runs against a real DefectDojo instance (needs DEFECTDOJO_LIVE_URL and DEFECTDOJO_LIVE_API_KEY)"]
addopts = "-m 'not live'"
