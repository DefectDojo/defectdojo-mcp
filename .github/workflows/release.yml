name: Release

# Builds the wheel, sdist and Docker image for a version tag.
# Publishing steps only run when the matching secret or variable exists,
# so nothing is published until maintainers set that up on purpose.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: defectdojo-mcp:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/defectdojo-mcp-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/defectdojo-mcp-image.tar

  publish-pypi:
    # Uses PyPI trusted publishing. Enable by configuring a trusted publisher on
    # PyPI for this repository and setting the repository variable PUBLISH_PYPI=true.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    # Pushes to GitHub Container Registry. Enable by setting the repository
    # variable PUBLISH_IMAGE=true.
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/defectdojo/defectdojo-mcp:${{ github.ref_name }}
            ghcr.io/defectdojo/defectdojo-mcp:latest

  publish-registry:
    # Publishes server.json to the official MCP registry after the PyPI package
    # exists. Enable by setting the repository variable PUBLISH_MCP_REGISTRY=true.
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
