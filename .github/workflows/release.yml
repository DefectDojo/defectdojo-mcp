name: Release

# Builds the wheel, sdist and Docker image for a version tag.
# Publishing steps only run when the matching secret or variable exists,
# so nothing is published until maintainers set that up on purpose.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Check server.json matches package version
        run: |
          version=$(uv version --short)
          python3 - "$version" <<'PY'
          import json, sys
          version = sys.argv[1]
          d = json.load(open("server.json"))
          found = [d["version"]] + [p["version"] if p["registryType"] == "pypi" else p["identifier"].rsplit(":", 1)[1] for p in d["packages"]]
          assert all(v == version for v in found), f"server.json versions {found} do not all match {version}"
          assert any(p["registryType"] == "pypi" and p["identifier"] == "defectdojo-mcp-server" for p in d["packages"])
          PY
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: defectdojo-mcp:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/defectdojo-mcp-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/defectdojo-mcp-image.tar

  publish-pypi:
    # Uses PyPI trusted publishing. Enable by configuring a trusted publisher on
    # PyPI for this repository and setting the repository variable PUBLISH_PYPI=true.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    # Pushes to GitHub Container Registry. Enable by setting the repository
    # variable PUBLISH_IMAGE=true.
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # server.json names the image by the bare version (0.1.0), which the MCP registry checks.
          tags: |
            ghcr.io/defectdojo/defectdojo-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/defectdojo/defectdojo-mcp:${{ github.ref_name }}
            ghcr.io/defectdojo/defectdojo-mcp:latest

  publish-registry:
    # Publishes server.json to the official MCP registry after the PyPI package and the
    # image exist (the registry checks both). Enable by setting PUBLISH_MCP_REGISTRY=true.
    needs: [publish-pypi, publish-image]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        # Pinned and checked against the release's checksums file, since this step runs with an OIDC token.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
